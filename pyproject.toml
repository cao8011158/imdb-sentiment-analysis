[project]
name = "imdb-sentiment-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "transformers>=4.48,<5", "torch>=2.3,<3", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
