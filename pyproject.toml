[project]
name = "imdb-sentiment-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "transformers>=4.57,<5", "torch>=2.3,<3", "accelerate>=1,<2", "tensorboard>=2.16,<3", "sentencepiece>=0.2,<1", "protobuf>=5,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
